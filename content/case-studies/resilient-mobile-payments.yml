order: 3

title: "Building Mobile Payment Flows with Explicit State"
blurb: "Compose UI, Retrofit/OkHttp, explicit payment states, and bounded polling for reloads, QR pay, and bill-pay."
read_time: "2–3 min"
main_icon: "icon-[tabler--device-mobile]"
tags:
  - "UX"
  - "Resilience"
  - "Testing"
subtitle: "Kotlin · Jetpack Compose · Retrofit · Coroutines · Material 3"
tldr: "Built wallet features for card reloads, QR payments, and bill-pay. The Retrofit API layer maps failures into repository results while the payment view model exposes bounded processing and terminal states."

context: "Android module focused on wallet flows, with the client communicating through explicit API and PaymentIntent states. External-provider settlement is not treated as verified by this case study."

problem:
  - "Payment flows were overly coupled to banking onboarding."
  - "Asynchronous payment intent states need to remain visible while the client polls for a terminal result."

architecture:
  - "Feature-based packages (screens, view models, DI)"
  - "Retrofit interfaces with clean DTOs, interceptors, consistent error envelopes"
  - "Compose UI with unified components (cards, inputs, buttons) and a11y labels"
  - "PaymentFlowViewModel with bounded exponential polling and explicit creating, processing, succeeded, failed, and canceled states"

