title: "Building Resilient Mobile Payment Flows"
blurb: "Compose UI, Retrofit/OkHttp, robust retries and clear flows for reloads, QR pay, and bill-pay on real networks."
read_time: "2–3 min"
main_icon: "icon-[tabler--device-mobile]"
tags:
  - "UX"
  - "Resilience"
  - "Testing"
subtitle: "Kotlin · Jetpack Compose · Retrofit · Coroutines · Material 3"
tldr: "Built wallet features (card reloads, QR payments, bill-pay). A clean Retrofit API layer and resilient UI reduced visible errors and clarified flows."

context: "Android module focused on wallet flows, designed to operate even when core banking features are unavailable."

problem:
  - "Payment flows were overly coupled to banking onboarding."
  - "Intermittent network caused confusing failures and abandons."

architecture:
  - "Feature-based packages (screens, view models, DI)"
  - "Retrofit interfaces with clean DTOs, interceptors, consistent error envelopes"
  - "Compose UI with unified components (cards, inputs, buttons) and a11y labels"
  - "Robust retries and offline affordances where possible"

