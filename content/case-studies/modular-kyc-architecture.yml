order: 2

title: "Architecting a Modular KYC Microservice Platform"
blurb: "Modular Spring Boot, Next.js/React, Android, and FastAPI KYC boundaries with an explicit component-check and review path."
read_time: "3–4 min"
main_icon: "icon-[devicon--java]"
tags:
  - "Impact"
  - "Architecture"
  - "Trade-offs"
subtitle: "Spring Boot · Next.js/React · Android · FastAPI KYC · OCR/vision modules"
tldr: "Designed and implemented a modular platform spanning backend, web, mobile, and a FastAPI KYC service. This case study documents service boundaries, check policy, and review states; no population-level accuracy or false-rejection outcome is published without labeled evaluation evidence."

context: "Solo/lead developer across multiple layers. The implementation separates secure account flows, KYC case state, and a wallet client that communicates through explicit API boundaries."

problem:
  - "Keep upload ownership, KYC case state, and component checks explicit across service boundaries"
  - "Keep web and Android clients aligned with the Spring API without moving authorization into the clients"
  - "Represent check thresholds and review outcomes without presenting them as measured population results"

architecture:
  - "Domain-oriented Spring Boot modules (auth, accounts, analytics, kyc, wallet)"
  - "FastAPI KYC service: face, liveness, OCR, document-classification checks, and an aggregate policy"
  - "Spring orchestration: bounded file reads, persisted check records, and UNDER_REVIEW fallback on service failure"
  - "Android Wallet: card reload, QR pay, and bill-pay intent flows through Retrofit interfaces and DTOs"
  - "Next.js web client with role-gated routes, bearer-token requests, and account flows"

stack:
  - name: "Spring Boot · Hibernate · MySQL"
    icon: "icon-[tabler--braces]"
  - name: "Next.js · React · TypeScript · Tailwind CSS"
    icon: "icon-[tabler--brand-react]"
  - name: "Kotlin / Android · Retrofit/OkHttp"
    icon: "icon-[tabler--device-mobile]"
  - name: "FastAPI · component-check policy · OCR/vision modules"
    icon: "icon-[tabler--brain]"

challenges:
  - "KYC service failure → persist an error check and move the case to UNDER_REVIEW rather than approving it"
  - "Upload integrity → require four distinct owned uploads with the expected document categories"
  - "Model boundary → keep optional ONNX/Tesseract modules distinct from the current simple default factory path"

results:
  - "Implemented explicit KYC upload, case, check, and status boundaries in the reviewed source"
  - "Implemented APPROVE, UNDER_REVIEW, and REJECT policy branches with reason codes and per-check records"
  - "Accuracy, false-rejection rate, manual-review volume, and production outcomes remain unmeasured in the reviewed evidence"

