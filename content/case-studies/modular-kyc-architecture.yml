title: "Architecting a Modular KYC Microservice Platform"
blurb: "Modular Spring Boot + FastAPI (AI KYC) with React admin and Android wallet. Focus on clean domains and resilient KYC."
read_time: "3–4 min"
main_icon: "icon-[devicon--java]"
tags:
  - "Impact"
