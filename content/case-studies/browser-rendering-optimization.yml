subtitle: "Python · Flask · HTML5 Canvas · JS Front-end"
tldr: "Built a browser-based neural simulator. Implemented a refractory period to prevent runaway firing and tuned rendering for smooth 60fps on mid-range devices."

context: "CS50 final project to demonstrate neuron dynamics with a clear visual model and interactive controls."

problem:
  - "Naive recursion caused infinite firing loops and browser lock-ups"
  - "Unbounded rendering produced frame drops on modest hardware"

architecture:
  - "Introduced refractory cooldown per neuron after firing"
  - "Separated simulation tick from render loop (requestAnimationFrame)"
  - "Added export/import and simple APIs for persistence"

